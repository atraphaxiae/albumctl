[package]
name = "albumctl"
version = "0.1.0"
authors = ["Nile Jocson"]
edition = "2024"
description = "A declarative local music library manager."
readme = "./README.md"
license = "MPL-2.0"

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
colored = "3.1.1"
error-stack = "0.8.0"
indoc = "2.0.7"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
toml = { version = "1.1.4", features = ["serde"] }
